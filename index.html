<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Le calendrier des repas et la liste de courses qui en découle. 151 recettes, dont les classiques français vérifiés.">
<meta name="theme-color" content="#F2F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icone-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semainier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{color-scheme:light dark}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
  .wrap{padding-top:max(26px,env(safe-area-inset-top));padding-bottom:max(90px,env(safe-area-inset-bottom))}
  #installer{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;border:0;border-radius:8px;padding:10px 16px;font:600 14px Archivo,system-ui,sans-serif;background:#2B4A7A;color:#FCFBF7;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
</style>
</head>
<body>
<title>Semainier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=DM+Serif+Display&family=Archivo:wght@400;500;600;700&display=swap">

<style>
:root{
  --bg:#F2F1EC; --surface:#FCFBF7; --surface-2:#E9E7DF;
  --ink:#1E2028; --ink-2:#5F636F; --ink-3:#8E929C;
  --line:#D9D6CC; --line-strong:#C2BEB1;
  --accent:#2B4A7A; --accent-soft:#DFE6F0; --accent-ink:#FCFBF7;
  --cuivre:#A85B2C; --cuivre-soft:#F2E3D8;
  --shadow:0 1px 2px rgba(30,32,40,.05), 0 10px 26px -20px rgba(30,32,40,.6);
  --r:11px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14151A; --surface:#1C1E25; --surface-2:#262932;
    --ink:#E9EAEF; --ink-2:#A7ABB7; --ink-3:#7B808C;
    --line:#2E313A; --line-strong:#3D414C;
    --accent:#8FB4E8; --accent-soft:#1F2A3A; --accent-ink:#14151A;
    --cuivre:#DB9463; --cuivre-soft:#2E2118;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -22px #000;
  }
}
:root[data-theme="dark"]{
  --bg:#14151A; --surface:#1C1E25; --surface-2:#262932;
  --ink:#E9EAEF; --ink-2:#A7ABB7; --ink-3:#7B808C;
  --line:#2E313A; --line-strong:#3D414C;
  --accent:#8FB4E8; --accent-soft:#1F2A3A; --accent-ink:#14151A;
  --cuivre:#DB9463; --cuivre-soft:#2E2118;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -22px #000;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,"Segoe UI",system-ui,sans-serif;font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.wrap{max-width:1300px;margin:0 auto;padding:26px 20px 90px}

/* bandeau */
.top{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand h1{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(32px,4.6vw,48px);line-height:1;margin:0;letter-spacing:-.015em}
.brand p{margin:7px 0 0;color:var(--ink-2);max-width:52ch;font-size:14.5px}
.pers{display:flex;align-items:center;gap:9px;border:1px solid var(--line-strong);border-radius:6px;padding:5px 7px 5px 13px;background:var(--surface)}
.pers .lab{font-size:12px;color:var(--ink-2)}
.pers .val{font-size:17px;min-width:1.5ch;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.rnd{width:27px;height:27px;border-radius:5px;border:1px solid var(--line-strong);background:var(--bg);display:grid;place-items:center;font-size:16px;line-height:1;padding:0 0 2px;transition:.15s}
.rnd:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* navigation */
.nav{display:flex;align-items:center;gap:10px;margin:18px 0 14px;flex-wrap:wrap}
.fleche{width:32px;height:32px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-size:15px}
.fleche:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mois-titre{font-family:"DM Serif Display",Georgia,serif;font-size:24px;letter-spacing:-.01em;text-transform:capitalize;min-width:9ch}
.auj{border:0;background:transparent;color:var(--cuivre);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:0}
.spacer{flex:1}
.bouton{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600}
.bouton:hover{background:var(--accent);color:var(--accent-ink)}
.sync{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.sync.ok::before{background:var(--accent)}
.sync.souci{color:var(--cuivre)}
.sync.souci::before{background:var(--cuivre)}
.bouton.sourdine{border-color:var(--line-strong);color:var(--ink-2)}
.bouton.sourdine:hover{background:var(--surface-2);color:var(--ink)}

.grille{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:22px;align-items:start}

/* calendrier */
.cal-cadre{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px}
.cal{display:grid;grid-template-columns:32px repeat(7,minmax(102px,1fr));gap:5px;min-width:790px}
.dow{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;color:var(--ink-3);text-align:center;padding:2px 0 6px}
.sem{display:flex;align-items:flex-start;justify-content:center;padding-top:6px}
.sem button{font-family:"Barlow Condensed",sans-serif;font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 4px;writing-mode:vertical-rl;transform:rotate(180deg)}
.sem button:hover{border-color:var(--line-strong);color:var(--ink)}
.sem button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.cel{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 5px 6px;min-height:92px;display:flex;flex-direction:column;gap:3px}
.cel.hors{opacity:.42}
.cel.sel{background:var(--accent-soft);border-color:var(--line-strong)}
.cel.auj{border-color:var(--cuivre);box-shadow:inset 0 0 0 1px var(--cuivre)}
.cel .jj{font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:500;line-height:1;color:var(--ink-2);padding:1px 3px 3px;font-variant-numeric:tabular-nums}
.cel.auj .jj{color:var(--cuivre);font-weight:600}
.ligne{flex:1;width:100%;text-align:left;display:flex;gap:5px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 5px;overflow:hidden;transition:.12s}
.ligne:hover{border-color:var(--accent)}
.ligne .r{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);flex:none}
.ligne .n{font-size:12.5px;line-height:1.2;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ligne.libre{background:transparent;border-style:dashed}
.ligne.libre .n{color:var(--ink-3);font-weight:400}
.ligne.libre:hover{background:var(--surface);border-style:solid}
.ligne.repos{border-style:dotted}
.ligne.repos .n{color:var(--ink-3);font-style:italic;font-weight:400}

/* vue semaine */
.cal-cadre.nu{background:transparent;border:0;box-shadow:none;padding:0;overflow:visible}
.semaine{display:flex;flex-direction:column;gap:8px}
.jour{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.jour.auj{border-color:var(--cuivre);background:linear-gradient(90deg,var(--cuivre-soft),var(--surface) 40%)}
.jour.passe{opacity:.6}
.jdate{display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);padding-right:10px}
.jdate .dow2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.11em;font-size:12.5px;color:var(--ink-3)}
.jour.auj .jdate .dow2{color:var(--cuivre)}
.jdate .jj2{font-family:"Barlow Condensed",sans-serif;font-size:29px;line-height:.95;font-weight:500;font-variant-numeric:tabular-nums}
.jdate .mois2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-height:60px;transition:.15s;display:block}
.slot:hover{border-color:var(--accent)}
.slot .r2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--ink-3);display:block;margin-bottom:2px}
.slot .n2{font-weight:600;font-size:14.5px;line-height:1.2;display:block}
.slot .s2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;color:var(--cuivre);display:block;margin-top:2px}
.slot.libre{border-style:dashed;background:transparent}
.slot.libre .n2{font-weight:400;color:var(--ink-3)}
.slot.libre:hover{background:var(--accent-soft);border-style:solid}
.vue{display:flex;gap:3px;background:var(--surface-2);border-radius:7px;padding:3px}
.vue button{border:0;background:transparent;border-radius:5px;padding:5px 13px;font-size:13px;color:var(--ink-2)}
.vue button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* liste */
.liste{position:sticky;top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.liste-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.liste-head h2{font-family:"DM Serif Display",Georgia,serif;font-size:22px;margin:0;letter-spacing:-.01em}
.portee{display:flex;gap:4px;margin-top:9px;background:var(--surface-2);border-radius:7px;padding:3px}
.portee button{flex:1;border:0;background:transparent;border-radius:5px;padding:5px 8px;font-size:12.5px;color:var(--ink-2)}
.portee button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.periode{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--ink-3);margin-top:8px;display:block}
.rayons{max-height:min(58vh,620px);overflow-y:auto;padding:2px 0}
.rayon{padding:11px 16px 5px}
.rayon h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:12px;letter-spacing:.13em;color:var(--ink-2);margin:0 0 5px;display:flex;gap:8px;align-items:center}
.rayon h3::after{content:"";flex:1;height:1px;background:var(--line)}
.art{display:flex;align-items:baseline;gap:9px;padding:3px 0;font-size:14.5px}
.art input{appearance:none;width:15px;height:15px;flex:none;border:1.5px solid var(--line-strong);border-radius:4px;background:var(--bg);cursor:pointer;position:relative;top:2px}
.art input:checked{background:var(--accent);border-color:var(--accent)}
.art input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--accent-ink);border-width:0 1.7px 1.7px 0;transform:rotate(42deg)}
.art label{flex:1;cursor:pointer}
.art .q{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.art.ok label,.art.ok .q{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.vide-liste{padding:26px 18px 32px;text-align:center;color:var(--ink-2);font-size:14.5px}
.vide-liste b{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:18px;color:var(--ink);display:block;margin-bottom:5px}
.liste-foot{display:flex;gap:7px;padding:11px 13px;border-top:1px solid var(--line);background:var(--surface-2)}
.act{flex:1;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 9px;font-size:13px;transition:.15s}
.act:hover{border-color:var(--accent);color:var(--accent)}
.act.primaire{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.act.primaire:hover{filter:brightness(1.2);color:var(--bg)}

/* sélecteur */
.voile{position:fixed;inset:0;background:rgba(20,21,26,.45);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px}
.panneau{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);width:min(660px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.panneau header{padding:14px 18px 11px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panneau h2{font-family:"DM Serif Display",Georgia,serif;font-size:21px;margin:0}
.creneau{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;color:var(--cuivre)}
.fermer{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--ink-3);padding:0 2px}
.fermer:hover{color:var(--ink)}
.recherche{margin:12px 18px 0;border:1px solid var(--line-strong);border-radius:7px;background:var(--bg);padding:8px 12px;width:calc(100% - 36px)}
.recherche:focus{outline:0;border-color:var(--accent)}
.cuisines{display:flex;flex-wrap:wrap;gap:5px;padding:11px 18px 10px}
.puce{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.puce:hover{border-color:var(--accent);color:var(--ink)}
.puce[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.choix{overflow-y:auto;padding:0 10px 12px}
.opt{width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:9px 12px;display:flex;gap:12px;align-items:baseline}
.opt:hover{background:var(--accent-soft)}
.opt .t{font-weight:600;font-size:14.5px}
.opt .d{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.opt .p{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--cuivre)}
.opt.retirer .t{color:var(--cuivre)}
.sep{padding:10px 22px 4px;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.13em;font-size:11.5px;color:var(--ink-3)}
.opt.ecrire .t{color:var(--accent)}
.opt-row{display:flex;align-items:stretch;border-radius:8px}
.opt-row:hover{background:var(--accent-soft)}
.opt-row .opt{flex:1}
.opt-row .opt:hover{background:transparent}
.mini{border:0;background:transparent;color:var(--ink-3);padding:0 12px;font-size:13px}
.mini:hover{color:var(--accent)}
.maison{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--accent)}

/* formulaire recette */
.form{padding:14px 18px 20px;display:flex;flex-direction:column;gap:13px;overflow-y:auto}
.champ{display:flex;flex-direction:column;gap:4px}
.champ>span{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--ink-3)}
.champ input,.champ textarea{border:1px solid var(--line-strong);border-radius:7px;background:var(--bg);padding:8px 11px;font:inherit;width:100%}
.champ input:focus,.champ textarea:focus{outline:0;border-color:var(--accent)}
.champ textarea{min-height:168px;resize:vertical;line-height:1.65;font-size:14.5px}
.duo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.aide{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.aide code{font-family:ui-monospace,monospace;font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.err{color:var(--cuivre);font-size:13.5px}
.form-actions{display:flex;gap:8px;align-items:center}
.form-actions .spacer{flex:1}
.danger{border:1px solid var(--line-strong);background:transparent;color:var(--cuivre);border-radius:6px;padding:7px 13px;font-size:13px}
.danger:hover{background:var(--cuivre-soft)}
.apercu{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13.5px}
.apercu h4{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--ink-3);margin:0 0 6px;font-weight:500}
.apercu ul{margin:0;padding-left:16px;columns:2;column-gap:18px}
.apercu li{margin-bottom:2px}
.apercu .ry{color:var(--ink-3);font-size:12px}
.ligne-nom{display:flex;gap:8px;align-items:stretch}
.ligne-nom input{flex:1}
.ia{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:7px;padding:0 14px;font-size:13px;font-weight:600;white-space:nowrap}
.ia:hover:not(:disabled){background:var(--accent);color:var(--accent-ink)}
.ia:disabled{opacity:.55;cursor:default}
.ia-etat{font-size:12.5px;color:var(--ink-3);min-height:1.2em}
.ia-etat.souci{color:var(--cuivre)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:9px 17px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.saut{display:none}

@media (max-width:1080px){
  .grille{grid-template-columns:minmax(0,1fr)}
  .liste{position:static}
  .rayons{max-height:none}
  .saut{display:flex;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 20px;font-weight:600;font-size:14px;text-decoration:none;box-shadow:0 12px 26px -12px rgba(0,0,0,.6)}
  .saut[hidden]{display:none}
}
@media print{
  .nav,.liste-foot,.saut,.pers,.portee{display:none}
  .grille{grid-template-columns:1fr}
  .cal-cadre,.liste{break-inside:avoid;box-shadow:none}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Semainier</h1>
      <p>Le calendrier des repas, mois par mois. Chaque plat posé sur une case verse ses ingrédients dans la liste de courses de la semaine.</p>
    </div>
    <div class="pers">
      <span class="lab">Couverts</span>
      <button class="rnd" id="moins" aria-label="Un couvert de moins">−</button>
      <span class="val" id="npers">4</span>
      <button class="rnd" id="plus" aria-label="Un couvert de plus">+</button>
    </div>
  </header>

  <nav class="nav">
    <div class="vue" id="vue-bascule">
      <button data-vue="mois">Mois</button>
      <button data-vue="semaine">Semaine</button>
    </div>
    <button class="fleche" id="prec" aria-label="Période précédente">‹</button>
    <button class="fleche" id="suiv" aria-label="Période suivante">›</button>
    <span class="mois-titre" id="mois-titre"></span>
    <button class="auj" id="retour" hidden>aujourd'hui</button>
    <span class="spacer"></span>
    <button class="bouton" id="remplir">Remplir la semaine</button>
    <button class="bouton sourdine" id="effacer">Vider la semaine</button>
    <span class="sync attente" id="sync" title="Où sont enregistrés ton calendrier et tes recettes">Connexion…</span>
  </nav>

  <div class="grille">
    <div class="cal-cadre">
      <div class="cal" id="cal"></div>

/* ---------- dates ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dateDe(j){return new Date(j+"T12:00:00");}
function lundiDe(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function noSemaine(d){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const s=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-s)/86400000-3+((s.getDay()+6)%7))/7);}
function fmt(d){return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});}
const AUJ=iso(new Date());

/* ---------- état ---------- */
const KEY="semainier-v2";
let S={couverts:4,repas:{},done:{},portee:"semaine",vue:"mois",perso:[]};
try{
  const s=JSON.parse(localStorage.getItem(KEY)||"null");
  if(s&&typeof s==="object")S=Object.assign(S,s);
  else{ /* reprise de l'ancienne version */
    const v1=JSON.parse(localStorage.getItem("semainier-v1")||"null");
    if(v1&&v1.plans){S.couverts=v1.couverts||4;Object.values(v1.plans).forEach(p=>Object.assign(S.repas,p));}
  }
}catch(e){}
if(!S.maj&&Object.keys(S.repas).length)S.maj=Date.now();

/* ---------- enregistrement local + synchronisation du compte ---------- */
const contenu=()=>JSON.stringify({couverts:S.couverts,repas:S.repas,done:S.done,perso:S.perso});
let dernier=contenu(),REF=null,tSync=null;
function etatSync(cls,txt){const n=document.getElementById("sync");if(n){n.className="sync "+cls;n.textContent=txt;}}
function save(){
  const c=contenu(),change=c!==dernier;
  if(change){dernier=c;S.maj=Date.now();}
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(change)pousser();
}
function pousser(){
  if(!REF)return;
  clearTimeout(tSync);
  tSync=setTimeout(()=>{
    REF.set({maj:S.maj,couverts:S.couverts,repas:S.repas,done:S.done,perso:S.perso})
      .then(()=>etatSync("ok","Synchronisé"))
      .catch(()=>etatSync("souci","Enregistré ici seulement"));
  },700);
}
async function initSync(){
  let db=null;
  try{if(window.claude&&claude.use)db=await claude.use("db");}catch(e){}
  if(!db)return etatSync("","Cet appareil seulement");
  REF=db.doc("menu/plan");
  REF.onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;
    if(!d){if(Object.keys(S.repas).length||S.perso.length){S.maj=S.maj||Date.now();pousser();}else etatSync("ok","Synchronisé");return;}
    const dm=d.maj||0;
    if(dm>(S.maj||0)){
      S.couverts=d.couverts||S.couverts;S.repas=d.repas||{};S.done=d.done||{};S.perso=d.perso||[];S.maj=dm;
      dernier=contenu();
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      rendu();etatSync("ok","Synchronisé");
    }else if(dm<(S.maj||0))pousser();
    else etatSync("ok","Synchronisé");
  },()=>{REF=null;etatSync("souci","Hors ligne — cet appareil");});
}

let vue=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),1,12);})();
let selLundi=iso(lundiDe(new Date()));

/* ---------- portée de la liste ---------- */
function bornes(){
  if(S.portee==="mois"){
    const a=new Date(vue.getFullYear(),vue.getMonth(),1,12),b=new Date(vue.getFullYear(),vue.getMonth()+1,0,12);
    return[iso(a),iso(b),"Mois de "+vue.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})];
  }
  const a=dateDe(selLundi),b=new Date(a);b.setDate(a.getDate()+6);
  return[iso(a),iso(b),"Semaine "+noSemaine(a)+" · du "+fmt(a)+" au "+fmt(b)];
}
const cleP=()=>S.portee==="mois"?"M:"+vue.getFullYear()+"-"+(vue.getMonth()+1):"S:"+selLundi;
const coches=()=>S.done[cleP()]||(S.done[cleP()]=[]);

/* ---------- agrégation ---------- */
function agreger(){
  const[a,b]=bornes(),map=new Map();
  for(const cle in S.repas){
    const j=cle.split("|")[0];
    if(j<a||j>b)continue;
    const d=plat(S.repas[cle]);if(!d)continue;
    for(const[nom,q,u,r,fixe]of d.ing){
      const k=nom+"|"+u;
      const it=map.get(k)||{k,nom,u,r,q:0,fixe:!!fixe,pour:[]};
      if(fixe)it.q=Math.max(it.q,q);else it.q+=q*S.couverts;
      if(!it.pour.includes(d.nom))it.pour.push(d.nom);
      map.set(k,it);
    }
  }
  const out={};
  for(const[,it]of map)(out[it.r]=out[it.r]||[]).push(it);
  for(const r in out)out[r].sort((x,y)=>x.nom.localeCompare(y.nom,"fr"));
  return out;
}
function arrondir(v,u){
  if(u==="g"||u==="ml")return v>=100?Math.round(v/10)*10:Math.max(5,Math.round(v/5)*5);
  if(u==="tranche"||u==="gousse")return Math.ceil(v);
  if(u==="pièce")return Math.max(0.5,Math.round(v*2)/2);
  return v;
}
function quantite(it){
  let q=arrondir(it.q,it.u),u=it.u;
  if(u==="g"&&q>=1000){q=Math.round(q/100)/10;u="kg";}
  else if(u==="ml"&&q>=1000){q=Math.round(q/100)/10;u="L";}
  const nb=String(Math.round(q*10)/10).replace(".",",");
  if(u==="pièce")return nb;
  if(it.fixe&&["pot","bouteille","boîte","botte","pincée","sachet","au goût"].includes(u))return u;
  const val=Math.round(q*10)/10;
  return nb+" "+(val>1&&["tranche","gousse","botte"].includes(u)?u+"s":u);
}

/* ---------- calendrier ---------- */
function cellules(){
  const p=new Date(vue.getFullYear(),vue.getMonth(),1,12);
  const debut=lundiDe(p);
  const fin=new Date(vue.getFullYear(),vue.getMonth()+1,0,12);
  const cases=[];const d=new Date(debut);
  while(d<=fin||cases.length%7!==0){cases.push(new Date(d));d.setDate(d.getDate()+1);}
  return cases;
}
function renduCal(){
  [...$("#vue-bascule").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.vue===S.vue));
  document.querySelector(".cal-cadre").classList.toggle("nu",S.vue==="semaine");
  if(S.vue==="semaine")return renduVueSemaine();
  $("#mois-titre").textContent=vue.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const ajdMois=new Date();
  $("#retour").hidden=vue.getFullYear()===ajdMois.getFullYear()&&vue.getMonth()===ajdMois.getMonth();
  const cases=cellules();
  let html=`<div></div>`+DOW.map(j=>`<div class="dow">${j}</div>`).join("");
  cases.forEach((d,i)=>{
    const j=iso(d),l=iso(lundiDe(d));
    if(i%7===0)html+=`<div class="sem"><button data-sem="${l}" aria-pressed="${l===selLundi}" title="Liste de courses de cette semaine">S${noSemaine(d)}</button></div>`;
    const hors=d.getMonth()!==vue.getMonth();
    html+=`<div class="cel ${hors?"hors":""} ${l===selLundi?"sel":""} ${j===AUJ?"auj":""}">
      <span class="jj">${d.getDate()}</span>`+
      REPAS.map(([r,lab])=>{

          <span class="r">${lab}</span><span class="n">${pl?pl.nom:(h?h.nom:"+")}</span></button>`;
      }).join("")+`</div>`;
  });
  $("#cal").innerHTML=html;
}

const sansAccent=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

/* ---------- lecture d'une recette écrite ---------- */
const UNITES=[
  [/^(kg|kilos?|kilogrammes?)$/,"g",1000],[/^(g|gr|grammes?)$/,"g",1],
  [/^(l|litres?)$/,"ml",1000],[/^(cl)$/,"ml",10],[/^(dl)$/,"ml",100],[/^(ml|millilitres?)$/,"ml",1],
  [/^(c\.?\s*[àa]\.?\s*s\.?|c\.?\s*[àa]\s*soupe|cas|cuill[eè]res?\s+[àa]\s+soupe)$/,"c. à soupe",1],
  [/^(c\.?\s*[àa]\.?\s*c\.?|c\.?\s*[àa]\s*caf[ée]|cac|cuill[eè]res?\s+[àa]\s+caf[ée])$/,"c. à café",1],
  [/^(pinc[ée]es?)$/,"pincée",1],[/^(sachets?)$/,"sachet",1],[/^(pots?)$/,"pot",1],
  [/^(bo[iî]tes?|conserves?)$/,"boîte",1],[/^(bouteilles?)$/,"bouteille",1],[/^(bottes?|bouquets?)$/,"botte",1],
  [/^(gousses?)$/,"gousse",1],[/^(tranches?)$/,"tranche",1],[/^(pi[eè]ces?|unit[ée]s?)$/,"pièce",1]
];
const RAYON_MOTS=[
  ["viande",["boeuf","poulet","porc","agneau","veau","dinde","jambon","lardon","saucisse","merguez","steak","viande","poisson","saumon","cabillaud","thon","crevette","moule","gambas","escalope","cuisse","chorizo","canard","bacon","truite","colin","calamar","filet de","haché"]],
  ["cremerie",["lait","creme","beurre","fromage","gruyere","parmesan","mozzarella","feta","yaourt","oeuf","ricotta","cheddar","reblochon","emmental","comte","mascarpone","tofu","pate brisee","pate feuilletee","chevre","raclette"]],
  ["legumes",["tomate","oignon","ail","carotte","courgette","aubergine","poivron","pomme de terre","patate","salade","laitue","epinard","champignon","citron","pomme","banane","poire","poireau","brocoli","chou","concombre","echalote","persil","basilic","coriandre","menthe","thym","romarin","gingembre","avocat","potiron","courge","navet","haricot","radis","betterave","fraise","orange","celeri","fenouil","mais doux","roquette","sucrine","panais","patate douce"]],
  ["boulangerie",["pain","baguette","tortilla","pita","brioche","burger","croissant","wrap","buns"]],
  ["surgeles",["surgel","frites","glace","petits pois","poelee"]]
];
function rayonDe(nom){
  const n=sansAccent(nom);
  for(const p of PLATS)for(const i of p.ing)if(sansAccent(i[0])===n)return i[3];
  for(const[r,mots]of RAYON_MOTS)if(mots.some(m=>n.includes(m)))return r;
  for(const p of PLATS)for(const i of p.ing){const a=sansAccent(i[0]);if(a.includes(n)||n.includes(a))return i[3];}
  return "epicerie";
}
function lireLigne(l){
  let s=l.replace(/^[\s\-–—•*·]+/,"").replace(/\s+/g," ").trim();
  if(!s)return null;
  const m=s.match(/^(\d+\s*\/\s*\d+|\d+[.,]?\d*)\s*(.*)$/);
  let q=null,reste=s;
  if(m){
    q=m[1].includes("/")?(parseFloat(m[1].split("/")[0])/parseFloat(m[1].split("/")[1])):parseFloat(m[1].replace(",","."));
    reste=m[2];
  }
  let unite="pièce",fixe=0;
  const mu=reste.match(/^([A-Za-zÀ-ÿ.]+(?:\s+[àa]\s+[A-Za-zÀ-ÿ]+)?|c\.?\s?[àa]\.?\s?[sc]\.?)\s*(.*)$/);
  if(mu){
    const cand=mu[1].toLowerCase().replace(/\.$/,"");
    for(const[re,u,mult]of UNITES)if(re.test(cand)||re.test(cand+".")){unite=u;if(q!=null)q*=mult;reste=mu[2];break;}
  }
  reste=reste.replace(/^(de\s+la\s+|de\s+l['’]|du\s+|des\s+|de\s+|d['’])/i,"").trim();
  if(!reste)return null;
  if(q==null){q=1;fixe=1;unite="au goût";}
  const nom=reste.charAt(0).toUpperCase()+reste.slice(1);
  return [nom,q,unite,rayonDe(nom),fixe];
}
function lireRecette(brut,pour){
  const out=[];
  brut.split(/\n/).forEach(l=>{
    const r=lireLigne(l);
    if(!r)return;
    if(!r[4])r[1]=r[1]/Math.max(1,pour);
    out.push(r);
  });
  return out;
}

  $("#types").innerHTML=TYPES.map(([k,l])=>`<button class="puce" data-type="${k}" aria-pressed="${filtreType===k}">${l}</button>`).join("");
  const pays=[["tout","Toutes"],["maison","Mes recettes"]].concat([...new Set(PLATS.map(p=>p.pays))].sort((a,b)=>a.localeCompare(b,"fr")).map(p=>[p,p]));
  $("#cuisines").innerHTML=pays.map(([k,l])=>`<button class="puce" data-pays="${k}" aria-pressed="${filtrePays===k}">${l}</button>`).join("");
  let liste=PLATS.concat(S.perso);
  if(filtreType!=="tout")liste=liste.filter(p=>typeDe(p)===filtreType);
  if(filtrePays==="maison")liste=S.perso.slice();
  else if(filtrePays!=="tout")liste=liste.filter(p=>p.pays===filtrePays);
  if(q)liste=liste.filter(p=>sansAccent(p.nom).includes(sansAccent(q))||sansAccent(p.pays).includes(sansAccent(q))||p.ing.some(i=>sansAccent(i[0]).includes(sansAccent(q))));
  liste.sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
  const occupe=cible&&S.repas[cible];
  const ligne=p=>p.maison
    ? `<div class="opt-row"><button class="opt" data-plat="${p.id}"><span class="t">${p.nom}</span><span class="maison">Ma recette</span><span class="d">${p.ing.length} ingrédients</span></button><button class="mini" data-edit="${p.id}" title="Modifier cette recette">✎</button></div>`
    : `<button class="opt" data-plat="${p.id}"><span class="t">${p.nom}</span><span class="p">${p.pays}</span><span class="d">${p.t} min</span></button>`;
  $("#choix").innerHTML=
    `<button class="opt ecrire" id="nouvelle"><span class="t">✎ Écrire ma recette</span><span class="d">colle tes ingrédients, j'en fais la liste</span></button>`
    +(occupe&&!q?`<button class="opt retirer" data-plat=""><span class="t">Vider ce créneau</span></button>`:"")
    +liste.map(ligne).join("")
    +(q||filtrePays==="maison"?"":`<div class="sep">Sans cuisiner</div>`+HORS.map(h=>`<button class="opt" data-plat="${h.id}"><span class="t">${h.nom}</span><span class="d">aucun ingrédient</span></button>`).join(""))
    +(liste.length?"":`<div class="vide-liste"><b>Aucun plat.</b>Écris ta propre recette, ou essaie un autre mot.</div>`);

/* ---------- demander la recette à Claude ---------- */
let IA=null;
if(window.claude&&claude.use)claude.use("sample").then(s=>{
  IA=s;
  const b=document.getElementById("f-ia");if(b&&IA)b.hidden=false;
}).catch(()=>{});
const SOUCIS={
  rate_limited:"Trop de demandes d'un coup — réessaie dans un moment.",
  usage_limit:"Ta limite d'utilisation Claude est atteinte pour l'instant.",
  cancelled:"",
  invalid_json:"Réponse illisible — relance, ou écris les ingrédients à la main.",
  refused:"Claude n'a pas voulu répondre à cette demande."
};
let ctlIA=null;
async function demander(){
  const nom=$("#f-nom").value.trim();
  const etat=$("#f-ia-etat"),btn=$("#f-ia");
  if(!IA)return;
  if(!nom){etat.className="ia-etat souci";etat.textContent="Écris d'abord le nom du plat.";return;}
  const pour=Math.max(1,parseInt($("#f-pour").value,10)||4);
  ctlIA=new AbortController();
  btn.disabled=true;etat.className="ia-etat";etat.textContent="Claude cherche la recette…";
  try{
    const r=await IA.json(
      `Donne la liste des ingrédients de la recette « ${nom} », pour ${pour} personnes.\n`+
      `Réponds uniquement par un objet JSON de cette forme :\n`+
      `{"nom":"Blanquette de veau","cuisine":"France","minutes":90,"ingredients":["800 g d'épaule de veau","3 carottes","20 cl de crème liquide","2 gousses d'ail","sel"]}\n`+
      `Règles : une chaîne par ingrédient, écrite « quantité unité nom » ; unités métriques (g, kg, ml, cl, cuillère à soupe, cuillère à café, gousse, tranche, botte, pincée) ; pas d'unité pour ce qui se compte à la pièce (« 3 carottes ») ; 5 à 15 ingrédients ; aucune étape de préparation ; pour le sel, le poivre et les épices à doser, écris juste leur nom sans quantité ; "cuisine" = le pays d'origine, "minutes" = durée totale en nombre entier.`,
      {modelTier:"quick",signal:ctlIA.signal}
    );
    const lignes=(r&&Array.isArray(r.ingredients)?r.ingredients:[]).map(x=>String(x).trim()).filter(Boolean);
    if(!lignes.length){etat.className="ia-etat souci";etat.textContent="Rien trouvé pour ce plat — précise le nom, ou écris les ingrédients toi-même.";return;}
    if(r.nom&&!$("#f-nom").dataset.fige)$("#f-nom").value=String(r.nom).slice(0,80);
    if(r.cuisine)$("#f-pays").value=String(r.cuisine).slice(0,30);
    if(r.minutes)$("#f-temps").value=parseInt(r.minutes,10)||"";
    const actuel=$("#f-ing").value.trim();
    $("#f-ing").value=actuel?actuel+"\n"+lignes.join("\n"):lignes.join("\n");
    apercu();
    etat.className="ia-etat";etat.textContent="Relis et corrige si besoin — ce sont des quantités pour "+pour+" personnes.";
  }catch(e){
    if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){
      IA=null;btn.hidden=true;etat.textContent="";return;
    }
    etat.className="ia-etat souci";
    etat.textContent=(e&&SOUCIS[e.code])||"Ça n'a pas marché — écris les ingrédients à la main.";
  }finally{btn.disabled=false;ctlIA=null;}
}
function apercu(){
  const brut=$("#f-ing").value,pour=Math.max(1,parseInt($("#f-pour").value,10)||4);
  const ing=lireRecette(brut,pour);
  if(!ing.length){$("#f-apercu").innerHTML="";return;}
  const noms=Object.fromEntries(RAYONS);
  $("#f-apercu").innerHTML=`<div class="apercu"><h4>Ce que je vais mettre dans la liste — pour ${S.couverts} couverts</h4><ul>`+
    ing.map(i=>`<li>${i[0]} — ${quantite({q:i[4]?i[1]:i[1]*S.couverts,u:i[2],fixe:!!i[4]})} <span class="ry">· ${noms[i[3]]}</span></li>`).join("")+`</ul></div>`;
}
function sauver(){
  const nom=$("#f-nom").value.trim(),pour=Math.max(1,parseInt($("#f-pour").value,10)||4);
  const brut=$("#f-ing").value,ing=lireRecette(brut,pour);
  const err=m=>{const e=$("#f-err");e.textContent=m;e.hidden=false;};
  if(!nom)return err("Il manque le nom du plat.");
  if(!ing.length)return err("Écris au moins un ingrédient, une ligne par ingrédient.");
  const r={
    id:editId||("perso-"+Date.now().toString(36)),maison:true,nom,
    pays:$("#f-pays").value.trim()||"Maison",t:parseInt($("#f-temps").value,10)||30,
    cat:"maison",tags:[],pour,brut,ing
  };
  const i=S.perso.findIndex(p=>p.id===r.id);
  if(i>=0)S.perso[i]=r;else S.perso.push(r);
  if(cible)S.repas[cible]=r.id;
  fermer();rendu();toast(editId?"Recette mise à jour":"Recette enregistrée");
}
function supprimer(){
  const id=editId;if(!id)return;
  S.perso=S.perso.filter(p=>p.id!==id);
  Object.keys(S.repas).forEach(c=>{if(S.repas[c]===id)delete S.repas[c];});
  fermer();rendu();toast("Recette supprimée");
}

/* ---------- actions ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2100);}
function joursSemaine(){const a=dateDe(selLundi);return Array.from({length:7},(_,i)=>{const d=new Date(a);d.setDate(a.getDate()+i);return iso(d);});}
function remplir(){
  const js=joursSemaine(),pris=new Set(),cats={},ajout=[];
  js.forEach(j=>REPAS.forEach(([r])=>{const d=plat(S.repas[j+"|"+r]);if(d){pris.add(d.id);cats[d.cat]=(cats[d.cat]||0)+1;}}));
  const pool=PLATS.filter(d=>!pris.has(d.id)&&typeDe(d)==="plat");
  for(let i=pool.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[pool[i],pool[k]]=[pool[k],pool[i]];}
  js.forEach(j=>REPAS.forEach(([r])=>{
    const cle=j+"|"+r;
    if(S.repas[cle])return;
    let idx=pool.findIndex(x=>(cats[x.cat]||0)<3&&(r!=="midi"||x.t<=45));
    if(idx<0)idx=pool.findIndex(x=>(cats[x.cat]||0)<3);
    if(idx<0)return;
    const d=pool.splice(idx,1)[0];
    cats[d.cat]=(cats[d.cat]||0)+1;S.repas[cle]=d.id;ajout.push(d);
  }));
  rendu();toast(ajout.length?ajout.length+" repas ajoutés":"Semaine déjà complète");
}
document.addEventListener("click",e=>{
  if(e.target.closest("#nouvelle")){ouvrirForm(null);return;}
  const ed=e.target.closest("[data-edit]");
  if(ed){ouvrirForm(ed.dataset.edit);return;}
  if(e.target.closest("#f-ia"))return demander();
  if(e.target.closest("#f-save"))return sauver();
  if(e.target.closest("#f-del"))return supprimer();
  if(e.target.closest("#f-annul")){editId=null;renduChoix();return;}
  const li=e.target.closest(".ligne,.slot[data-cle]");
  if(li){ouvrir(li.dataset.cle);return;}
  const vb=e.target.closest("[data-vue]");
  if(vb){
    if(vb.dataset.vue==="mois"){const l=dateDe(selLundi);vue=new Date(l.getFullYear(),l.getMonth(),1,12);}
    S.vue=vb.dataset.vue;rendu();return;
  }
  const sm=e.target.closest("[data-sem]");
  if(sm){selLundi=sm.dataset.sem;S.portee="semaine";rendu();return;}
  const op=e.target.closest("[data-plat]");
  if(op&&cible){
    const v=op.dataset.plat;
    if(v)S.repas[cible]=v;else delete S.repas[cible];
    fermer();rendu();return;
  }
  const ty=e.target.closest("[data-type]");
  if(ty){filtreType=ty.dataset.type;renduChoix();return;}
  const pa=e.target.closest("[data-pays]");
  if(pa){filtrePays=pa.dataset.pays;renduChoix();return;}
  const po=e.target.closest("[data-portee]");
  if(po){S.portee=po.dataset.portee;rendu();return;}
  if(e.target.closest("#fermer")||e.target===$("#voile"))return fermer();
  if(e.target.closest("#prec")||e.target.closest("#suiv")){
    const pas=e.target.closest("#prec")?-1:1;
    if(S.vue==="mois")vue=new Date(vue.getFullYear(),vue.getMonth()+pas,1,12);
    else{const d=dateDe(selLundi);d.setDate(d.getDate()+7*pas);selLundi=iso(d);vue=new Date(d.getFullYear(),d.getMonth(),1,12);}
    rendu();return;
  }
  if(e.target.closest("#retour")){const n=new Date();vue=new Date(n.getFullYear(),n.getMonth(),1,12);selLundi=iso(lundiDe(n));rendu();return;}
  if(e.target.closest("#plus")){S.couverts=Math.min(12,S.couverts+1);rendu();return;}
  if(e.target.closest("#moins")){S.couverts=Math.max(1,S.couverts-1);rendu();return;}
  if(e.target.closest("#remplir"))return remplir();
  if(e.target.closest("#effacer")){joursSemaine().forEach(j=>REPAS.forEach(([r])=>delete S.repas[j+"|"+r]));S.done["S:"+selLundi]=[];rendu();toast("Semaine vidée");return;}
  if(e.target.closest("#decocher")){S.done[cleP()]=[];rendu();return;}
  if(e.target.closest("#copier"))return copier();
});
$("#recherche").addEventListener("input",e=>{q=e.target.value.trim();renduChoix();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#voile").hidden)fermer();});
$("#rayons").addEventListener("change",e=>{
  const k=e.target.dataset.k;if(!k)return;
  const d=coches();
  S.done[cleP()]=e.target.checked?d.concat([k]):d.filter(x=>x!==k);
  rendu();
});

function texte(){
  const[a,b,titre]=bornes();
  let s=titre.toUpperCase()+" — "+S.couverts+" couverts\n\n";
  const d=dateDe(a),fin=dateDe(b);
  for(let x=new Date(d);x<=fin;x.setDate(x.getDate()+1)){
    const j=iso(x),m=S.repas[j+"|midi"],so=S.repas[j+"|soir"];
    if(!m&&!so)continue;
    const nom=id=>{const p=plat(id)||horsPlat(id);return p?p.nom:"—";};
    s+=DOW[(x.getDay()+6)%7].toUpperCase()+" "+x.getDate()+" : "+(m?"midi "+nom(m):"")+(m&&so?" / ":"")+(so?"soir "+nom(so):"")+"\n";
  }
  const g=agreger(),done=coches();
  RAYONS.forEach(([k,l])=>{
    const items=(g[k]||[]).filter(i=>!done.includes(i.k));
    if(!items.length)return;
    s+="\n"+l.toUpperCase()+"\n";
    items.forEach(it=>{s+="[ ] "+it.nom+" — "+quantite(it)+"\n";});
  });
  return s;
}
async function copier(){
  if(!Object.keys(agreger()).length)return toast("Ajoute d'abord des plats");
  const t=texte();
  try{await navigator.clipboard.writeText(t);return toast("Liste copiée");}catch(e){}
  try{
    const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();
    toast(ok?"Liste copiée":"Copie impossible — sélectionne la liste à la main");
  }catch(e){toast("Copie impossible — sélectionne la liste à la main");}
}

rendu();
initSync();
</script>

<button id="installer" hidden>Installer l'app</button>
<script>
// installation Android : on garde l'invite pour l'offrir au bon moment
let invite = null;
addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  invite = e;
  document.getElementById("installer").hidden = false;
});
document.getElementById("installer").addEventListener("click", async () => {
  document.getElementById("installer").hidden = true;
  if (!invite) return;
  invite.prompt();
  await invite.userChoice;
  invite = null;
});
addEventListener("appinstalled", () => { document.getElementById("installer").hidden = true; });

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
